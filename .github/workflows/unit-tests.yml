name: Unit tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool pkg-config \
            libglib2.0-dev libncurses-dev valgrind

      - name: Configure
        run: |
          ./autogen.sh
          ./configure --prefix="$RUNNER_TEMP/inetflow"

      - name: Build
        run: |
          make
          make unittest

      # Run under valgrind directly so that memory errors and leaks fail the job
      - name: Run unit tests
        run: >-
          G_SLICE=always-malloc valgrind --leak-check=full --error-exitcode=1
          --suppressions=valgrind.supp ./unittest

      # Build a program against the installed library with only pkg-config,
      # as the README describes
      - name: Build against the installed library
        run: |
          make install
          export PKG_CONFIG_PATH="$RUNNER_TEMP/inetflow/lib/pkgconfig"
          printf '#include <inetflow.h>\nint main(void)\n{\n    inet_flow_table_free(inet_flow_table_new());\n    return 0;\n}\n' > "$RUNNER_TEMP/app.c"
          cc -Wall -Werror -o "$RUNNER_TEMP/app" "$RUNNER_TEMP/app.c" $(pkg-config --cflags --libs inetflow)
          LD_LIBRARY_PATH="$(pkg-config --variable=libdir inetflow)" "$RUNNER_TEMP/app"

  # AddressSanitizer and UndefinedBehaviorSanitizer find unaligned and out of
  # bounds reads that valgrind does not, such as an unaligned load that works
  # on x86 but traps on other CPUs
  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool pkg-config \
            libglib2.0-dev libncurses-dev

      - name: Configure
        run: |
          ./autogen.sh
          ./configure

      - name: Run unit tests
        run: make test-asan
