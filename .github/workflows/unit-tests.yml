name: Unit tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool pkg-config \
            libglib2.0-dev libncurses-dev valgrind

      - name: Configure
        run: |
          ./autogen.sh
          ./configure

      - name: Build
        run: |
          make
          make unittest

      # Run under valgrind directly so that memory errors and leaks fail the job
      - name: Run unit tests
        run: >-
          G_SLICE=always-malloc valgrind --leak-check=full --error-exitcode=1
          --suppressions=valgrind.supp ./unittest
